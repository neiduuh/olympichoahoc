{% extends "base.html" %}{% block content %}
<div class="admin-page-head"><div><h1>✏️ Sửa câu hỏi #{{q.id}}</h1><p class="muted">{{r.title}}</p></div><a class="btn secondary" href="{{url_for('admin_questions',rid=r.id)}}">← Quay lại danh sách</a></div>
<div class="card"><form method="post" enctype="multipart/form-data">
<div class="grid"><div class="field"><label>Mini game</label><select name="game_type" id="game" onchange="syncQuestionType()"><option value="bee" {% if q.game_type=='bee' %}selected{% endif %}>⛏️ Đào kho báu</option>{% if r.selected_sport=='soccer' %}<option value="soccer" {% if q.game_type=='soccer' %}selected{% endif %}>⚽ Sút bóng</option>{% else %}<option value="basketball" {% if q.game_type=='basketball' %}selected{% endif %}>🏀 Ném bóng</option>{% endif %}<option value="racing" {% if q.game_type=='racing' %}selected{% endif %}>🚗 Lái xe</option></select></div><div class="field"><label>Dạng câu</label><select id="qtype" disabled><option value="short" {% if q.qtype=='short' %}selected{% endif %}>Trả lời ngắn</option><option value="mcq" {% if q.qtype=='mcq' %}selected{% endif %}>Trắc nghiệm 4 phương án</option><option value="tf4" {% if q.qtype=='tf4' %}selected{% endif %}>4 ý đúng/sai</option></select></div></div>
<div class="field"><label>Nội dung câu hỏi</label><textarea name="content" id="content" required>{{q.content}}</textarea><div class="chem-tools"><button type="button" onclick="chemFormat('content','sub')">x₂ Chỉ số dưới</button><button type="button" onclick="chemFormat('content','sup')">x² Chỉ số trên</button><button type="button" onclick="chemFormat('content','normal')">Aa Bình thường</button></div></div>
<div class="field"><label>Hình ảnh kèm câu hỏi</label>{% if q.image_data %}<img id="questionImagePreview" class="admin-question-image" src="{{url_for('question_image',qid=q.id)}}" alt="Ảnh hiện tại"><label class="inline-check"><input type="checkbox" name="remove_image" value="1"> Xóa ảnh hiện tại</label>{% else %}<img id="questionImagePreview" class="admin-question-image" hidden alt="Xem trước ảnh">{% endif %}<input type="file" name="question_image" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewQuestionImage(this)"><small class="muted">Chọn ảnh mới nếu muốn thay ảnh hiện tại.</small></div>
<div id="mcq" style="display:none"><div class="grid">{% for i in range(4) %}<div class="field"><label>Phương án {{'ABCD'[i]}}</label><input name="opt{{i}}" id="opt{{i}}" value="{{q.options[i] if i < q.options|length else ''}}"><div class="chem-tools"><button type="button" onclick="chemFormat('opt{{i}}','sub')">x₂</button><button type="button" onclick="chemFormat('opt{{i}}','sup')">x²</button><button type="button" onclick="chemFormat('opt{{i}}','normal')">Aa</button></div></div>{% endfor %}</div><div class="field"><label>Đáp án đúng</label><select name="correct_mcq">{% for i in range(4) %}<option value="{{i}}" {% if q.correct|string==i|string %}selected{% endif %}>{{'ABCD'[i]}}</option>{% endfor %}</select></div></div>
<div id="short"><div class="field"><label>Đáp án đúng</label><input name="correct_short" id="correct_short" value="{{q.correct|join('|') if q.correct is iterable and q.correct is not string else q.correct}}"><div class="chem-tools"><button type="button" onclick="chemFormat('correct_short','sub')">x₂</button><button type="button" onclick="chemFormat('correct_short','sup')">x²</button><button type="button" onclick="chemFormat('correct_short','normal')">Aa</button></div></div></div>
<div id="tf4" style="display:none">{% for i in range(4) %}<div class="grid"><div class="field"><label>Ý {{'abcd'[i]}})</label><input name="tftext{{i}}" id="tftext{{i}}" value="{{q.options[i] if i < q.options|length else ''}}"><div class="chem-tools"><button type="button" onclick="chemFormat('tftext{{i}}','sub')">x₂</button><button type="button" onclick="chemFormat('tftext{{i}}','sup')">x²</button><button type="button" onclick="chemFormat('tftext{{i}}','normal')">Aa</button></div></div><div class="field"><label>Đúng/Sai</label><select name="tf{{i}}"><option value="true" {% if i < q.correct|length and q.correct[i] %}selected{% endif %}>Đúng</option><option value="false" {% if i < q.correct|length and not q.correct[i] %}selected{% endif %}>Sai</option></select></div></div>{% endfor %}</div>
<div class="grid"><div class="field"><label>Điểm câu</label><input type="number" name="points" value="{{q.points}}"></div><div class="field"><label>Giải thích</label><input name="explanation" id="explanation" value="{{q.explanation or ''}}"><div class="chem-tools"><button type="button" onclick="chemFormat('explanation','sub')">x₂</button><button type="button" onclick="chemFormat('explanation','sup')">x²</button><button type="button" onclick="chemFormat('explanation','normal')">Aa</button></div></div></div>
<button class="btn">💾 Lưu thay đổi</button></form></div>
<script src="{{url_for('static',filename='js/admin-question-editor.js')}}?v=5.1"></script>
{% endblock %}
