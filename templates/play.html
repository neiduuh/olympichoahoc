{% extends "base.html" %}{% block content %}
<div class="game-shell chemistry-arena">
  <div class="game-header">
    <div>
      <h1>{{r.title}}</h1>
      <div class="anticheat">⚠️ Chuyển tab/cửa sổ sẽ được ghi nhận là vi phạm.</div>
    </div>
    <div class="hud"><span class="score">Điểm: <b id="score">0</b></span><span>⏱ <b id="clock">00:00</b></span></div>
  </div>
  <div class="progress"><div id="prog"></div></div>
  <div id="root"></div>
</div>
<script>
const grouped={{grouped|tojson}};
const attemptId={{attempt_id}}, roundId={{r.id}};
const sport=(grouped.soccer||[]).length ? 'soccer' : ((grouped.basketball||[]).length ? 'basketball' : null);
const games=[['bee','🐝 Ong tìm mật'], ...(sport?[[sport,sport==='soccer'?'⚽ Sút bóng vào lưới':'🏀 Ném bóng vào rổ']]:[]), ['racing','🏍️ Lái xe vượt chướng ngại vật']]
  .filter(x=>(grouped[x[0]]||[]).length);
let gi=0, qi=0, score=0, violations=0, started=Date.now(), detail=[];
let questionDeadline=null, timerHandle=null, locked=false, beeStep=0, beeBlockedDirs=new Set(), beeChosenDir=null;
const root=document.getElementById('root');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function updateGlobalClock(){document.getElementById('clock').textContent=fmt((Date.now()-started)/1000)}
setInterval(updateGlobalClock,1000); updateGlobalClock();
document.addEventListener('visibilitychange',()=>{if(document.hidden){violations++;fetch('/api/violation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:attemptId})});}});
function totalQuestions(){return games.reduce((s,x)=>s+grouped[x[0]].length,0)}
function doneQuestions(){return games.slice(0,gi).reduce((s,x)=>s+grouped[x[0]].length,0)+qi}
function setProgress(){document.getElementById('prog').style.width=(totalQuestions()?doneQuestions()/totalQuestions()*100:100)+'%'}
function startQuestionTimer(seconds){clearInterval(timerHandle); questionDeadline=Date.now()+seconds*1000; const el=document.getElementById('qtime'); if(!el)return; const tick=()=>{const left=Math.ceil((questionDeadline-Date.now())/1000);el.textContent=fmt(left); if(left<=0){clearInterval(timerHandle); timeoutQuestion();}};tick();timerHandle=setInterval(tick,500)}
function timeoutQuestion(){if(locked)return;locked=true;const g=games[gi]?.[0];const q=grouped[g]?.[qi];if(!q)return;document.getElementById('feedback').innerHTML='⏰ <b>Hết thời gian.</b> Câu này không được tính điểm.';detail.push({q:q.id,score:0,timeout:true,game:g});playOutcome(g,false,0);setTimeout(nextQuestion,1500)}
function nextQuestion(){clearInterval(timerHandle);locked=false;qi++;beeChosenDir=null;render()}
function render(){clearInterval(timerHandle);locked=false;if(gi>=games.length){finish();return}const [g]=games[gi],arr=grouped[g];if(qi>=arr.length){gi++;qi=0;beeStep=0;beeBlockedDirs=new Set();beeChosenDir=null;render();return}setProgress(); if(g==='bee')renderBee(arr[qi],arr.length); else if(g==='soccer')renderSoccer(arr[qi],arr.length); else if(g==='basketball')renderBasketball(arr[qi],arr.length); else renderRacing(arr[qi],arr.length)}
function commonQuestion(q,title,body,extra=''){return `<div class="question-panel"><div class="question-top"><span class="badge">${title}</span><span class="round-timer">Còn lại <b id="qtime">--:--</b></span></div><h3>${esc(q.content)}</h3>${body}<div id="feedback" class="game-feedback" aria-live="polite"></div>${extra}</div>`}
function shortInput(){return `<div class="answer-row"><input id="ans" autocomplete="off" placeholder="Nhập câu trả lời ngắn"><button class="btn" id="shortSubmit">Trả lời</button></div>`}
function mcq(q){return `<div class="options game-options">${q.options.map((x,i)=>`<button type="button" class="option" data-answer="${i}"><b>${'ABCD'[i]}.</b> ${esc(x)}</button>`).join('')}</div>`}
function tf4(q){return `<div class="tf-grid">${q.options.map((x,i)=>`<div class="tf-item"><div><b>${String.fromCharCode(97+i)})</b> ${esc(x)}</div><div class="tf-buttons"><button type="button" data-tf="${i}" data-val="true">Đúng</button><button type="button" data-tf="${i}" data-val="false">Sai</button></div></div>`).join('')}</div><button class="btn" id="tfSubmit">Chốt đáp án</button>`}
function bindAnswers(q,g){if(q.qtype==='short'){const btn=document.getElementById('shortSubmit'),inp=document.getElementById('ans');btn.addEventListener('click',()=>submitAns(inp.value));inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAns(inp.value)});inp.focus()}else if(q.qtype==='mcq'){document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>submitAns(b.dataset.answer)))}else{const vals=[null,null,null,null];document.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.tf;vals[i]=b.dataset.val==='true';document.querySelectorAll(`[data-tf="${i}"]`).forEach(x=>x.classList.toggle('selected',x===b))}));document.getElementById('tfSubmit').addEventListener('click',()=>{if(vals.some(v=>v===null)){document.getElementById('feedback').textContent='Hãy chọn Đúng/Sai cho đủ 4 ý.';return}submitAns(vals)})}}
function renderBee(q,n){
 const visualStep=Math.min(6,Math.round((beeStep/Math.max(1,n))*6));
 const pathCells=Array.from({length:7},(_,i)=>`<div class="bee-node ${i<visualStep?'passed':''} ${i===visualStep?'current':''}" style="left:${8+i*13.5}%;top:${i%2?48:30}%">${i===0?'🌼':i===6?'🍯':(i<=visualStep?'✨':'🪨')}</div>`).join('');
 root.innerHTML=`<section class="mini-intro"><div><b>🐝 Ong tìm mật</b><span>Chọn một hướng chưa bị chặn rồi trả lời câu hỏi. Sai: khóa hướng đó. Đúng: ong vượt chướng ngại vật và sang nút tiếp theo.</span></div><span>Câu ${qi+1}/${n}</span></section><div class="bee-world"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="bee-map">${pathCells}<div class="bee-avatar" id="beeAvatar" style="left:${8+visualStep*13.5}%;top:${visualStep%2?40:22}%">🐝</div></div><div class="direction-pad"><button type="button" data-dir="up" ${beeBlockedDirs.has('up')?'disabled':''}>${beeBlockedDirs.has('up')?'⛔':'↑'}</button><div><button type="button" data-dir="left" ${beeBlockedDirs.has('left')?'disabled':''}>${beeBlockedDirs.has('left')?'⛔':'←'}</button><button type="button" data-dir="right" ${beeBlockedDirs.has('right')?'disabled':''}>${beeBlockedDirs.has('right')?'⛔':'→'}</button></div><button type="button" data-dir="down" ${beeBlockedDirs.has('down')?'disabled':''}>${beeBlockedDirs.has('down')?'⛔':'↓'}</button><small>Chọn hướng</small></div></div>${commonQuestion(q,'Chướng ngại '+(qi+1),shortInput(),`<div class="road-status">Hướng bị chặn: <b id="blockedCount">${beeBlockedDirs.size}</b>/4</div>`)} `;
 document.getElementById('shortSubmit').disabled=true;
 document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;beeChosenDir=b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('chosen',x===b));document.getElementById('shortSubmit').disabled=false;document.getElementById('ans').focus()}));
 bindAnswers(q,'bee');
 // bindAnswers bật lại nút sau khi gắn sự kiện; khóa cho đến khi người chơi chọn hướng.
 document.getElementById('shortSubmit').disabled=!beeChosenDir;
 startQuestionTimer(Math.max(1,1200-Math.floor((Date.now()-started)/1000)));
}
function renderSoccer(q,n){root.innerHTML=`<section class="mini-intro"><div><b>⚽ Sút bóng vào lưới</b><span>Đúng: ghi bàn. Sai: thủ môn cản phá hoặc bóng đi ra ngoài.</span></div><span>Câu ${qi+1}/${n}</span></section><div class="soccer-field"><div class="stadium">OLYMPIC HÓA HỌC</div><div class="goal"><div class="keeper" id="keeper">🧤</div></div><div class="football-player">🏃</div><div class="football" id="football">⚽</div><div class="spot"></div></div>${commonQuestion(q,'Câu '+(qi+1),mcq(q))}`;bindAnswers(q,'soccer');startQuestionTimer(120)}
function renderBasketball(q,n){root.innerHTML=`<section class="mini-intro"><div><b>🏀 Ném bóng vào rổ</b><span>Đúng: bóng vào rổ. Sai: bóng bật vành hoặc ném lệch.</span></div><span>Câu ${qi+1}/${n}</span></section><div class="basket-court"><div class="backboard"></div><div class="hoop"></div><div class="basket-player">⛹️</div><div class="basket-ball" id="basketBall">🏀</div><div class="court-lines"></div></div>${commonQuestion(q,'Câu '+(qi+1),mcq(q))}`;bindAnswers(q,'basketball');startQuestionTimer(120)}
function renderRacing(q,n){root.innerHTML=`<section class="mini-intro"><div><b>🏍️ Lái xe vượt chướng ngại vật</b><span>Đúng 1/2/3/4 ý: 5/15/25/50 điểm. Mỗi câu tối đa 10 phút.</span></div><span>Câu ${qi+1}/${n}</span></section><div class="race-world"><div class="mountains">⛰️　⛰️　⛰️</div><div class="road"><div class="lane"></div><div class="bike" id="bike" style="left:${8+qi*35}%">🏍️</div><div class="barrier">🚧</div><div class="finishflag">🏁</div></div></div>${commonQuestion(q,'Trạm '+(qi+1),tf4(q))}`;bindAnswers(q,'racing');startQuestionTimer(600)}
async function submitAns(ans){if(locked)return;const currentGame=games[gi]?.[0];if(currentGame==='bee'&&!beeChosenDir){document.getElementById('feedback').textContent='Hãy chọn một hướng bay trước khi trả lời.';return}locked=true;clearInterval(timerHandle);const g=games[gi][0],q=grouped[g][qi];document.querySelectorAll('button,input,select').forEach(el=>{if(root.contains(el))el.disabled=true});const res=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:attemptId,question_id:q.id,answer:ans})});const d=await res.json();score+=d.score;document.getElementById('score').textContent=score;detail.push({q:q.id,score:d.score,ok:d.ok,game:g});const fb=document.getElementById('feedback');fb.innerHTML=(d.ok?'✅ <b>Chính xác!</b> ':'❌ <b>Chưa chính xác.</b> ')+esc(d.explanation||'')+(g==='racing'?` <strong>+${d.score} điểm</strong>`:'');playOutcome(g,d.ok,d.score);setTimeout(nextQuestion,g==='racing'?1800:1500)}
function playOutcome(g,ok,pts){if(g==='bee'){const bee=document.getElementById('beeAvatar');if(ok){beeStep++;beeBlockedDirs=new Set();bee?.classList.add('bee-fly');}else{if(beeChosenDir)beeBlockedDirs.add(beeChosenDir);document.getElementById('blockedCount').textContent=beeBlockedDirs.size;bee?.classList.add('bee-bump');if(beeBlockedDirs.size>=4){document.getElementById('feedback').innerHTML+=' <b>🚫 Cả 4 hướng đã bị khóa — Ong tìm mật kết thúc.</b>';qi=grouped.bee.length-1;}}}else if(g==='soccer'){const ball=document.getElementById('football'),keeper=document.getElementById('keeper');if(ok)ball?.classList.add('goal-shot');else{ball?.classList.add(Math.random()>.5?'saved-shot':'miss-shot');keeper?.classList.add('keeper-save')}}else if(g==='basketball'){document.getElementById('basketBall')?.classList.add(ok?'swish-shot':'rim-miss')}else if(g==='racing'){const bike=document.getElementById('bike');const advance=pts>=50?58:pts>=25?42:pts>=15?28:pts>=5?18:8;bike.style.transform=`translateX(${advance}vw)`;bike.classList.add('bike-go')}}
async function finish(){clearInterval(timerHandle);setProgress();const elapsed=Math.floor((Date.now()-started)/1000);const res=await fetch('/api/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:attemptId,round_id:roundId,score,elapsed,violations,detail,selected_sport:sport})});const d=await res.json();const sportName=sport==='soccer'?'Sút bóng vào lưới':sport==='basketball'?'Ném bóng vào rổ':'Không có';root.innerHTML=`<div class="finish-card"><div class="finish-cup">🏆</div><h2>Hoàn thành vòng thi!</h2><p>Game thể thao lượt này: <b>${sportName}</b></p><div class="finish-score">${score} điểm</div><p>Thời gian: <b>${fmt(elapsed)}</b> · Vi phạm chuyển tab: <b>${violations}</b></p><a class="btn" href="${d.redirect}">Xem bảng xếp hạng</a></div>`;document.getElementById('prog').style.width='100%'}
render();
</script>
{% endblock %}
