{% extends "base.html" %}{% block content %}
<div class="game-shell phaser-shell">
  <div class="game-topbar">
    <div class="game-title-wrap">
      <div class="game-kicker">OLYMPIC HÓA HỌC</div>
      <h1>{{r.title}}</h1>
      <div class="anticheat">⚠️ Hệ thống ghi nhận khi thí sinh chuyển tab hoặc rời cửa sổ thi.</div>
    </div>
    <div class="pro-hud">
      <div class="hud-chip"><span>Điểm</span><strong id="score">0</strong></div>
      <div class="hud-chip"><span>Thời gian</span><strong id="clock">00:00</strong></div>
      <div class="hud-chip danger-chip"><span>Vi phạm</span><strong id="violationCount">0</strong></div>
    </div>
  </div>

  <div class="game-progress-wrap">
    <div class="game-progress-meta"><span id="gameStepText">Chuẩn bị</span><span id="questionStepText">0/0 câu</span></div>
    <div class="game-progress"><div id="prog"></div></div>
  </div>

  <div class="phase-tabs" id="phaseTabs" aria-label="Các mini game trong vòng thi"></div>

  <div class="phaser-frame">
    <div id="phaser-stage" aria-label="Khu vực mini game Phaser"></div>
    <div id="phaserFallback" class="phaser-fallback" hidden>
      Không tải được bộ máy đồ họa Phaser. Hãy kiểm tra kết nối mạng và tải lại trang.
    </div>
  </div>

  <div id="questionRoot"></div>
</div>

<script>
(async function(){
const grouped={{grouped|tojson}};
function shuffleArray(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
if((grouped.racing||[]).length){ grouped.racing=shuffleArray(grouped.racing).slice(0, Math.min(2, grouped.racing.length)); }
const attemptId={{attempt_id}}, roundId={{r.id}};
const playerName={{(me.full_name or me.username)|tojson}};
const playerClass={{(me.class_name or '')|tojson}};
const sport=(grouped.soccer||[]).length ? 'soccer' : ((grouped.basketball||[]).length ? 'basketball' : null);
window.CHEM_ASSETS={
  basketballScene: {{ url_for('static', filename='img/basketball_scene_v49.png')|tojson }},
  raceRockScene: {{ url_for('static', filename='img/race_obstacle_rock_v50.png')|tojson }},
  racePuddleScene: {{ url_for('static', filename='img/race_obstacle_puddle_v50.png')|tojson }},
  raceBushScene: {{ url_for('static', filename='img/race_obstacle_bush_v50.png')|tojson }}
};
const games=[
  ['bee','Đào kho báu','⛏️'],
  ...(sport?[[sport,sport==='soccer'?'Sút bóng vào lưới':'Ném bóng vào rổ',sport==='soccer'?'⚽':'🏀']]:[]),
  ['racing','Lái xe vượt chướng ngại vật','🏍️']
].filter(x=>(grouped[x[0]]||[]).length);

let gi=0, qi=0, score=0, violations=0, started=Date.now(), detail=[];
let questionDeadline=null, timerHandle=null, locked=false;
const TREASURE_ROUTE_LENGTH=5;
const TREASURE_ROUTE_META=[
  {id:'mountain',name:'Đường Núi Đá',icon:'⛰️'},
  {id:'cave',name:'Đường Hang Bí Mật',icon:'🕯️'},
  {id:'forest',name:'Đường Rừng Cổ',icon:'🌿'}
];
const treasure={
  paths:TREASURE_ROUTE_META.map(x=>({...x,step:0,blocked:false,blockedAt:null})),
  activePath:null,
  position:{pathId:null,step:-1},
  correct:0,
  answered:0,
  gameScore:0,
  failedRockCount:0,
  pending:null,
  startedAt:null,
  ended:false,
  finishing:false,
  busy:false
};
let raceProgress=0;
const raceState={
  obstacles: shuffleArray(['rock','puddle','bush']).slice(0, Math.max(1, Math.min(2, (grouped.racing||[]).length))),
  questionVisible:false, animating:false
};
const raceObstacleLabels={rock:'hòn đá', puddle:'vũng nước', bush:'bụi cây'};
const questionRoot=document.getElementById('questionRoot');
const scoreEl=document.getElementById('score');
const violationEl=document.getElementById('violationCount');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function updateGlobalClock(){document.getElementById('clock').textContent=fmt((Date.now()-started)/1000)}
setInterval(updateGlobalClock,1000); updateGlobalClock();

const fallbackBox=document.getElementById('phaserFallback');
function loadExternalScript(src){
  return new Promise((resolve,reject)=>{
    const tag=document.createElement('script');
    tag.src=src; tag.async=true;
    tag.onload=()=>resolve(src);
    tag.onerror=()=>{tag.remove();reject(new Error('Không tải được '+src));};
    document.head.appendChild(tag);
  });
}
async function ensurePhaserLoaded(){
  if(window.Phaser)return true;
  const sources=[
    "{{url_for('static',filename='vendor/phaser.min.js')}}",
    'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js',
    'https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'
  ];
  for(const src of sources){
    try{
      await loadExternalScript(src);
      if(window.Phaser)return true;
    }catch(e){ console.warn('[Olympic Hóa học] Phaser source failed:',src); }
  }
  return false;
}
const phaserOK=await ensurePhaserLoaded();
if(phaserOK){ fallbackBox.hidden=true; }
if(!phaserOK){
  fallbackBox.hidden=false;
  fallbackBox.innerHTML='<strong>Không tải được bộ máy đồ họa Phaser.</strong><br>Website đã thử bản cục bộ và 3 máy chủ dự phòng nhưng đều không thành công.<br><button type="button" class="btn" id="retryPhaser" style="margin-top:14px">Tải lại game</button>';
  document.getElementById('retryPhaser')?.addEventListener('click',()=>location.reload());
  return;
}
try{
  await loadExternalScript("{{url_for('static',filename='js/phaser-games.js')}}?v=5.0");
}catch(e){
  fallbackBox.hidden=false;
  fallbackBox.textContent='Đã tải Phaser nhưng không tải được mã mini game. Hãy tải lại trang.';
  return;
}
if(!window.ChemGames){
  fallbackBox.hidden=false;
  fallbackBox.textContent='Phaser đã tải nhưng mini game không khởi tạo được. Hãy tải lại trang.';
  return;
}
window.ChemGames.ensure();

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    violations++;
    violationEl.textContent=violations;
    fetch('/api/violation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:attemptId})}).catch(()=>{});
  }
});

function gameTargetUnits(g){return g==='bee'?15:(grouped[g]||[]).length}
function totalQuestions(){return games.reduce((s,x)=>s+gameTargetUnits(x[0]),0)}
function doneQuestions(){
  let d=0;
  for(let i=0;i<gi;i++)d+=gameTargetUnits(games[i][0]);
  if(gi<games.length){const g=games[gi][0];d+=g==='bee'?Math.min(15,treasure.answered):qi;}
  return d;
}
function setProgress(){
  const total=totalQuestions(),done=doneQuestions();
  document.getElementById('prog').style.width=(total?Math.min(100,done/total*100):100)+'%';
  document.getElementById('questionStepText').textContent=`${Math.min(done+1,total)}/${total} câu`;
  document.getElementById('gameStepText').textContent=gi<games.length?`Mini game ${gi+1}/${games.length}: ${games[gi][1]}`:'Hoàn thành';
}
function renderPhaseTabs(){
  const box=document.getElementById('phaseTabs');
  box.innerHTML=games.map((g,i)=>`<div class="phase-tab ${i<gi?'done':''} ${i===gi?'active':''}"><span class="phase-number">${i<gi?'✓':i+1}</span><span>${g[2]} ${g[1]}</span></div>`).join('');
}
function startQuestionTimer(seconds){
  clearInterval(timerHandle);
  questionDeadline=Date.now()+Math.max(1,seconds)*1000;
  const tick=()=>{
    const left=Math.ceil((questionDeadline-Date.now())/1000);
    const el=document.getElementById('qtime');
    if(el){
      el.textContent=fmt(left);
      el.closest('.question-timer')?.classList.toggle('urgent',left<=30);
    }
    if(games[gi]?.[0]==='soccer') window.ChemGames?.updateSoccerTimer(left);
    if(games[gi]?.[0]==='basketball') window.ChemGames?.updateBasketballTimer(left);
    if(games[gi]?.[0]==='bee') window.ChemGames?.updateTreasureTimer(left);
    if(left<=0){clearInterval(timerHandle);timeoutQuestion();}
  };
  tick(); timerHandle=setInterval(tick,400);
}
function timeoutQuestion(){
  if(locked)return; locked=true;
  const g=games[gi]?.[0],q=grouped[g]?.[qi]; if(!q)return;
  const fb=document.getElementById('feedback');
  if(fb)fb.innerHTML='<span class="result-badge bad">HẾT GIỜ</span> Câu này không được tính điểm.';
  detail.push({q:q.id,score:0,timeout:true,game:g});
  disableQuestionControls();
  if(g==='bee'){
    endTreasure(false,'Hết 20 phút — chưa tìm được kho báu.');
  }else{
    window.ChemGames?.outcome(g,false,{points:0}).then(nextQuestion);
  }
}
function disableQuestionControls(){questionRoot.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);if(games[gi]?.[0]==='soccer')window.ChemGames?.lockSoccerAnswers(); if(games[gi]?.[0]==='basketball')window.ChemGames?.lockBasketballAnswers();}
function nextQuestion(){clearInterval(timerHandle);locked=false;if(games[gi]?.[0]==='racing'){raceState.questionVisible=false;raceState.animating=false;}qi++;render()}

function render(){
  clearInterval(timerHandle);locked=false;
  if(gi>=games.length){finish();return}
  const [g]=games[gi],arr=grouped[g];
  setProgress();renderPhaseTabs();
  if(g==='bee'){
    if(treasure.ended){gi++;qi=0;render();return}
    renderTreasure(arr);return;
  }
  if(qi>=arr.length){gi++;qi=0;render();return}
  const q=arr[qi];
  if(g==='soccer')renderSoccer(q,arr.length);
  else if(g==='basketball')renderBasketball(q,arr.length);
  else renderRacing(q,arr.length);
}

function questionImageHtml(q){return q?.image_url?`<div class="question-image-wrap"><img src="${esc(q.image_url)}" alt="Hình minh họa câu hỏi"></div>`:''}
function questionCard(q,title,body,hint=''){
  return `<section class="pro-question-card">
    <div class="question-card-top">
      <div><div class="question-label">${title}</div>${hint?`<div class="question-hint">${hint}</div>`:''}</div>
      <div class="question-timer"><span>Thời gian còn lại</span><strong id="qtime">--:--</strong></div>
    </div>
    <div class="question-text">${esc(q.content)}</div>
    ${questionImageHtml(q)}
    ${body}
    <div id="feedback" class="pro-feedback" aria-live="polite"></div>
  </section>`;
}
function shortInput(){return `<div class="short-answer-row"><input id="ans" autocomplete="off" spellcheck="false" placeholder="Nhập câu trả lời ngắn"><button class="btn answer-submit" id="shortSubmit" type="button">Trả lời</button></div>`}
function mcq(q){return `<div class="pro-options">${q.options.map((x,i)=>`<button type="button" class="pro-option" data-answer="${i}"><span class="opt-letter">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`}
function tf4(q){return `<div class="pro-tf-grid">${q.options.map((x,i)=>`<div class="pro-tf-item"><div class="tf-statement"><span>${String.fromCharCode(97+i)})</span>${esc(x)}</div><div class="tf-choice"><button type="button" data-tf="${i}" data-val="true">Đúng</button><button type="button" data-tf="${i}" data-val="false">Sai</button></div></div>`).join('')}</div><button class="btn answer-submit" id="tfSubmit" type="button">Chốt 4 ý</button>`}

function bindAnswers(q){
  if(q.qtype==='short'){
    const btn=document.getElementById('shortSubmit'),inp=document.getElementById('ans');
    btn.addEventListener('click',()=>submitAns(inp.value));
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAns(inp.value)});
    inp.focus();
  }else if(q.qtype==='mcq'){
    document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('selected',x===b));
      submitAns(b.dataset.answer);
    }));
  }else{
    const vals=[null,null,null,null];
    document.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.tf; vals[i]=b.dataset.val==='true';
      document.querySelectorAll(`[data-tf="${i}"]`).forEach(x=>x.classList.toggle('selected',x===b));
    }));
    document.getElementById('tfSubmit').addEventListener('click',()=>{
      if(vals.some(v=>v===null)){document.getElementById('feedback').innerHTML='<span class="result-badge warn">CHƯA ĐỦ</span> Hãy chọn Đúng/Sai cho cả 4 ý.';return}
      submitAns(vals);
    });
  }
}

const mcqShuffleMap=new Map();
function getShuffledMcq(q){
  if(mcqShuffleMap.has(q.id)) return mcqShuffleMap.get(q.id);
  const options=(q.options||[]).map((text,originalIndex)=>({text,originalIndex}));
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  const result={
    options: options.map(x=>x.text),
    answerMap: options.map(x=> String(x.originalIndex))
  };
  mcqShuffleMap.set(q.id,result);
  return result;
}

const tfShuffleMap=new Map();
function getShuffledTf(q){
  if(tfShuffleMap.has(q.id)) return tfShuffleMap.get(q.id);
  const items=(q.options||[]).map((text,originalIndex)=>({text,originalIndex}));
  const shuffled=shuffleArray(items);
  const result={options:shuffled.map(x=>x.text), indexMap:shuffled.map(x=>x.originalIndex)};
  tfShuffleMap.set(q.id,result);
  return result;
}
function mcqFromOptions(options){return `<div class="pro-options">${options.map((x,i)=>`<button type="button" class="pro-option" data-answer="${i}"><span class="opt-letter">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`}
function tf4FromOptions(options){return `<div class="pro-tf-grid">${options.map((x,i)=>`<div class="pro-tf-item"><div class="tf-statement"><span>${String.fromCharCode(97+i)})</span>${esc(x)}</div><div class="tf-choice"><button type="button" data-tf="${i}" data-val="true">Đúng</button><button type="button" data-tf="${i}" data-val="false">Sai</button></div></div>`).join('')}</div><button class="btn answer-submit" id="tfSubmit" type="button">Chốt 4 ý</button>`}
function buildRacingQuestionCard(q,n){
  const label=raceObstacleLabels[raceState.obstacles[qi]]||'chướng ngại vật';
  if(q.qtype==='short'){
    return {
      html: questionCard(q,`Chướng ngại ${qi+1}/${n}: ${label}`,shortInput(),'Xe đã dừng lại trước chướng ngại vật. Trả lời đúng để vượt qua.'),
      bind(){ const btn=document.getElementById('shortSubmit'),inp=document.getElementById('ans'); btn.addEventListener('click',()=>submitAns(inp.value)); inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAns(inp.value)}); inp.focus(); }
    };
  }
  if(q.qtype==='mcq'){
    const shuffled=getShuffledMcq(q);
    return {
      html: questionCard(q,`Chướng ngại ${qi+1}/${n}: ${label}`,mcqFromOptions(shuffled.options),'Đáp án đã được đảo ngẫu nhiên để đảm bảo công bằng.'),
      bind(){ document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('selected',x===b)); submitAns(shuffled.answerMap[+b.dataset.answer]); })); }
    };
  }
  const shuffled=getShuffledTf(q);
  return {
    html: questionCard(q,`Chướng ngại ${qi+1}/${n}: ${label}`,tf4FromOptions(shuffled.options),'Các ý a/b/c/d đã được xáo trộn ngẫu nhiên cho mỗi lượt thi.'),
    bind(){ const vals=[null,null,null,null]; document.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.tf; vals[i]=b.dataset.val==='true'; document.querySelectorAll(`[data-tf="${i}"]`).forEach(x=>x.classList.toggle('selected',x===b)); })); document.getElementById('tfSubmit').addEventListener('click',()=>{ if(vals.some(v=>v===null)){document.getElementById('feedback').innerHTML='<span class="result-badge warn">CHƯA ĐỦ</span> Hãy chọn Đúng/Sai cho cả 4 ý.'; return;} const mapped=[]; vals.forEach((v,displayIdx)=>{ mapped[shuffled.indexMap[displayIdx]]=v; }); submitAns(mapped); }); }
  };
}

function treasureRoute(id){return treasure.paths.find(p=>p.id===id)||null}
function treasureHasPath(){return treasure.paths.some(p=>!p.blocked && p.step<TREASURE_ROUTE_LENGTH)}
function treasureRemaining(){
  if(treasure.startedAt===null)treasure.startedAt=Date.now();
  return Math.max(0,1200-Math.floor((Date.now()-treasure.startedAt)/1000));
}
function treasureStateForGame(){
  return {
    paths:treasure.paths.map(p=>({...p})),
    activePath:treasure.activePath,
    position:{...treasure.position},
    correct:treasure.correct,
    answered:treasure.answered,
    gameScore:treasure.gameScore,
    failedRockCount:treasure.failedRockCount,
    finished:treasure.ended
  };
}
function renderTreasure(arr){
  document.querySelector('.pro-hud')?.classList.remove('soccer-hud-hidden');
  if(treasure.startedAt===null)treasure.startedAt=Date.now();
  const remaining=treasureRemaining();
  if(remaining<=0){endTreasure(false,'Hết 20 phút — chưa tìm được kho báu.');return;}
  if(!arr.length){endTreasure(false,'Mini game chưa có câu hỏi. Admin cần nhập bộ câu hỏi Đào kho báu.');return;}

  window.ChemGames?.showTreasure({
    state:treasureStateForGame(),
    timeLeft:remaining,
    playerName,
    className:playerClass,
    onMove:(target)=>handleTreasureMove(target,arr)
  });

  const active=treasureRoute(treasure.activePath);
  const routeText=active
    ? `Đang đi <b>${esc(active.name)}</b> • Chặng ${Math.min(active.step+1,TREASURE_ROUTE_LENGTH)}/${TREASURE_ROUTE_LENGTH}`
    : 'Chọn một trong <b>3 con đường</b> để bắt đầu.';
  questionRoot.innerHTML=`<div class="soccer-status-strip bee-status-strip" aria-live="polite">
    <b>⛏️ TÌM ĐƯỜNG ĐẾN KHO BÁU</b><br>
    <span>${routeText}</span><br>
    <span>Đúng: mở chặng đường và +10 điểm (tối đa 70). Sai: con đường đó bị chặn, phải chọn đường khác. Tới kho báu sẽ được thưởng cho đủ 100 điểm.</span>
    <span id="qtime" style="display:none"></span>
  </div>`;
  startQuestionTimer(remaining);
}
async function handleTreasureMove(target,arr){
  if(treasure.busy||treasure.ended||treasure.finishing||locked)return;
  const path=treasureRoute(target?.pathId);
  if(!path||path.blocked)return;
  if(treasure.activePath && treasure.activePath!==path.id)return;
  if(target.step!==path.step || target.step>=TREASURE_ROUTE_LENGTH)return;
  if(qi>=arr.length){
    await endTreasure(false,'Đã hết câu hỏi trong ngân hàng trước khi tìm được kho báu. Nên có ít nhất 15 câu.');return;
  }

  treasure.busy=true;
  treasure.activePath=path.id;
  treasure.pending={pathId:path.id,step:path.step,key:`${path.id}:${path.step}`,type:'question'};
  questionRoot.innerHTML=`<div class="soccer-status-strip bee-status-strip" aria-live="polite">
    <b>⛏️ ${esc(path.name)} — đang tiến tới chặng ${path.step+1}/${TREASURE_ROUTE_LENGTH}...</b><br>
    <span>Nhân vật sẽ dừng tại dấu ? rồi câu hỏi mới xuất hiện.</span>
    <span id="qtime" style="display:none"></span>
  </div>`;
  await (window.ChemGames?.treasureApproach(treasure.pending)||Promise.resolve());
  showTreasureQuestion(arr[qi],arr.length);
}
function showTreasureQuestion(q,n){
  treasure.busy=false;
  const path=treasureRoute(treasure.pending?.pathId);
  const step=(treasure.pending?.step??0)+1;
  const remaining=treasureRemaining();
  questionRoot.innerHTML=questionCard(
    q,
    `${path?esc(path.name):'Đường kho báu'} • Chặng ${step}/${TREASURE_ROUTE_LENGTH} • Câu ngẫu nhiên ${Math.min(qi+1,n)}/${n}`,
    shortInput(),
    '<span>Đúng: mở đường. Sai: đường hiện tại bị chặn bằng chướng ngại vật và bạn phải quay về chọn đường khác.</span>'
  );
  bindAnswers(q);
  document.getElementById('ans')?.focus();
  startQuestionTimer(remaining);
}
async function awardTreasureBonus(){
  const res=await fetch('/api/treasure-complete',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({attempt_id:attemptId})
  });
  if(!res.ok)throw new Error('Không thể ghi nhận phần thưởng kho báu');
  return res.json();
}
async function endTreasure(success,message){
  if(treasure.ended||treasure.finishing)return;
  clearInterval(timerHandle);
  locked=true;
  treasure.finishing=true;

  let bonus=0;
  let questionScore=treasure.gameScore;
  if(success){
    try{
      const d=await awardTreasureBonus();
      questionScore=Number.isFinite(+d.question_score)?+d.question_score:treasure.gameScore;
      bonus=Number.isFinite(+d.bonus)?+d.bonus:Math.max(0,100-questionScore);
      treasure.gameScore=100;
      score=Number.isFinite(+d.total_score)?+d.total_score:100;
      scoreEl.textContent=score;
    }catch(err){
      treasure.finishing=false;
      locked=false;
      questionRoot.innerHTML=`<section class="pro-finish-card">
        <div class="finish-medal">⚠️</div>
        <div class="finish-kicker">ĐÃ TÌM THẤY KHO BÁU</div>
        <h2>Chưa ghi được phần thưởng</h2>
        <p>Mạng đang chập chờn. Bấm nút dưới để ghi nhận điểm kho báu rồi tiếp tục.</p>
        <button class="btn" id="retryTreasureBonus" type="button">Ghi nhận kho báu & tiếp tục</button>
      </section>`;
      document.getElementById('retryTreasureBonus')?.addEventListener('click',()=>endTreasure(true,message));
      return;
    }
  }

  treasure.ended=true;
  treasure.finishing=false;
  if(success){
    questionRoot.innerHTML=`<section class="pro-finish-card">
      <div class="finish-medal">🏆</div>
      <div class="finish-kicker">ĐÀO KHO BÁU THÀNH CÔNG</div>
      <h2>100/100 điểm</h2>
      <div class="finish-stats">
        <div><span>Điểm câu hỏi</span><strong>${questionScore}/70</strong></div>
        <div><span>Thưởng kho báu</span><strong>+${bonus}</strong></div>
        <div><span>Đường đã thử</span><strong>${treasure.paths.filter(p=>p.step>0||p.blocked).length}/3</strong></div>
      </div>
      <p>${esc(message)}</p><p>Đang chuyển sang mini game tiếp theo...</p>
    </section>`;
  }else{
    questionRoot.innerHTML=`<section class="pro-finish-card">
      <div class="finish-medal">🪨</div>
      <div class="finish-kicker">ĐÀO KHO BÁU KẾT THÚC</div>
      <h2>${treasure.gameScore}/100 điểm</h2>
      <div class="finish-stats">
        <div><span>Câu đã trả lời</span><strong>${treasure.answered}</strong></div>
        <div><span>Đường bị chặn</span><strong>${treasure.paths.filter(p=>p.blocked).length}/3</strong></div>
        <div><span>Điểm câu hỏi</span><strong>${treasure.gameScore}/70</strong></div>
      </div>
      <p>${esc(message)}</p><p>Đang chuyển sang mini game tiếp theo...</p>
    </section>`;
  }
  setProgress();renderPhaseTabs();
  await new Promise(r=>setTimeout(r,2200));
  locked=false;gi++;qi=0;render();
}
function renderSoccer(q,n){
  document.querySelector('.pro-hud')?.classList.add('soccer-hud-hidden');
  questionRoot.innerHTML=questionImageHtml(q)+'<div id="feedback" class="soccer-status-strip" aria-live="polite">Chọn một đáp án A/B/C/D ngay trên sân để thực hiện cú sút.</div><div class="question-timer soccer-hidden-timer"><span>Thời gian còn lại</span><strong id="qtime">02:00</strong></div>';
  window.ChemGames?.showSoccer({
    question:qi+1,total:n,questionText:q.content,options:q.options||[],score,
    timeLeft:120,playerName,className:playerClass,
    onAnswer:(ans)=>submitAns(ans)
  });
  startQuestionTimer(120);
}
function renderBasketball(q,n){
  document.querySelector('.pro-hud')?.classList.add('soccer-hud-hidden');
  const shuffled=getShuffledMcq(q);
  questionRoot.innerHTML=questionImageHtml(q)+'<div id="feedback" class="soccer-status-strip" aria-live="polite">Chọn một đáp án A/B/C/D ngẫu nhiên ngay trên sân để thực hiện cú ném.</div><div class="question-timer soccer-hidden-timer"><span>Thời gian còn lại</span><strong id="qtime">02:00</strong></div>';
  window.ChemGames?.showBasketball({
    question:qi+1,total:n,questionText:q.content,options:shuffled.options,score,
    timeLeft:120,playerName,className:playerClass,
    onAnswer:(ans)=>submitAns(shuffled.answerMap[+ans])
  });
  startQuestionTimer(120);
}
function renderRacing(q,n){
  document.querySelector('.pro-hud')?.classList.remove('soccer-hud-hidden');
  window.ChemGames?.showRacing({question:qi+1,total:n,progress:raceProgress,obstacle:raceState.obstacles[qi],playerName,className:playerClass,stopped:raceState.questionVisible});
  if(!raceState.questionVisible){
    questionRoot.innerHTML=`<section class="pro-question-card"><div class="question-card-top"><div><div class="question-label">Chướng ngại ${qi+1}/${n}</div><div class="question-hint">Xe đang chạy tới ${raceObstacleLabels[raceState.obstacles[qi]]||'chướng ngại vật'}.</div></div></div><div id="feedback" class="pro-feedback" aria-live="polite"><span class="result-badge warn">CHỜ XE DỪNG LẠI</span> Có hoạt ảnh xe chạy, dừng trước chướng ngại vật rồi mới hiện câu hỏi.</div></section>`;
    if(!raceState.animating){
      raceState.animating=true;
      Promise.resolve(window.ChemGames?.racingApproach?.()||Promise.resolve()).then(()=>{ raceState.animating=false; raceState.questionVisible=true; render(); });
    }
    return;
  }
  const pack=buildRacingQuestionCard(q,n);
  questionRoot.innerHTML=pack.html;
  pack.bind();
  startQuestionTimer(600);
}

async function submitAns(ans){
  if(locked)return;
  const g=games[gi][0],q=grouped[g][qi];
  if(g==='bee'&&!treasure.pending){document.getElementById('feedback').innerHTML='<span class="result-badge warn">CHƯA TỚI Ô ?</span> Hãy di chuyển tới một ô dấu hỏi trước.';return}
  locked=true;clearInterval(timerHandle);disableQuestionControls();
  try{
    const res=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:attemptId,question_id:q.id,answer:ans})});
    if(!res.ok)throw new Error('Không thể chấm câu trả lời');
    const d=await res.json();
    score=Number.isFinite(+d.total_score)?+d.total_score:score+(+d.score||0); scoreEl.textContent=score; if(g==='soccer')window.ChemGames?.updateSoccerScore(score); if(g==='basketball')window.ChemGames?.updateBasketballScore(score); if(g==='bee')window.ChemGames?.updateTreasureScore(treasure.correct);
    detail.push({q:q.id,score:d.score,ok:d.ok,game:g,duplicate:!!d.duplicate});
    const fb=document.getElementById('feedback');
    fb.innerHTML=(d.ok?'<span class="result-badge good">CHÍNH XÁC</span>':'<span class="result-badge bad">CHƯA ĐÚNG</span>')+
      (d.explanation?` <span>${esc(d.explanation)}</span>`:'')+(g==='racing'?` <strong>+${d.score} điểm</strong>`:'');

    if(g==='bee'){
      const target=treasure.pending;
      const path=treasureRoute(target?.pathId);
      if(!target||!path)throw new Error('Trạng thái đường đi không hợp lệ');

      treasure.answered++;
      if(d.ok){
        path.step=Math.max(path.step,target.step+1);
        treasure.activePath=path.id;
        treasure.position={pathId:path.id,step:path.step-1};
        treasure.correct++;
        treasure.gameScore=Math.min(70,treasure.gameScore+(+d.score||0));
      }else{
        path.blocked=true;
        path.blockedAt=target.step;
        treasure.failedRockCount++;
        treasure.activePath=null;
        treasure.position={pathId:null,step:-1};
      }

      await (window.ChemGames?.treasureOutcome(d.ok,target,{
        points:+d.score||0,
        score:treasure.gameScore,
        capped:treasure.gameScore>=70
      })||Promise.resolve());

      qi++;
      treasure.pending=null;
      treasure.busy=false;
      locked=false;
      window.ChemGames?.updateTreasureScore(treasure.gameScore);

      if(d.ok && path.step>=TREASURE_ROUTE_LENGTH){
        await (window.ChemGames?.treasureWin({pathId:path.id})||Promise.resolve());
        await endTreasure(true,`Bạn đã vượt qua đủ ${TREASURE_ROUTE_LENGTH} chặng của ${path.name} và mở được rương kho báu!`);
        return;
      }
      if(!d.ok && !treasureHasPath()){
        await endTreasure(false,'Cả 3 con đường đều đã bị chướng ngại vật chặn. Không còn đường tới kho báu.');
        return;
      }
      if(qi>=grouped.bee.length){
        await endTreasure(false,'Đã hết câu hỏi trong ngân hàng trước khi tìm được kho báu. Admin nên có ít nhất 15 câu.');
        return;
      }
      render();return;
    }
    if(g==='racing'){
      const add=d.ok?50:0;
      raceProgress=Math.min(100,raceProgress+add);
      await (window.ChemGames?.racingResult?.(d.ok,{obstacle:raceState.obstacles[qi]}) || Promise.resolve());
      nextQuestion();
      return;
    }
    await (window.ChemGames?.outcome(g,d.ok,{points:+d.score||0}) || Promise.resolve());
    nextQuestion();
  }catch(err){
    locked=false;
    document.getElementById('feedback').innerHTML='<span class="result-badge bad">LỖI MẠNG</span> Không gửi được đáp án. Hãy thử lại.';
    if(g==='soccer'){window.ChemGames?.unlockSoccerAnswers();}
    else if(g==='basketball'){window.ChemGames?.unlockBasketballAnswers();}
    else if(q.qtype==='short'){document.getElementById('shortSubmit').disabled=false;document.getElementById('ans').disabled=false;}
    else if(q.qtype==='mcq'){document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=false);}
    else{document.querySelectorAll('[data-tf],#tfSubmit').forEach(x=>x.disabled=false);}
  }
}

async function finish(){
  clearInterval(timerHandle);renderPhaseTabs();document.getElementById('prog').style.width='100%';
  document.getElementById('gameStepText').textContent='Đã hoàn thành vòng thi';document.getElementById('questionStepText').textContent=`${totalQuestions()}/${totalQuestions()} câu`;
  const elapsed=Math.floor((Date.now()-started)/1000);
  try{
    const res=await fetch('/api/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:attemptId,round_id:roundId,elapsed,violations,detail,selected_sport:sport})});
    const d=await res.json(); score=+d.score||score;scoreEl.textContent=score;
    const finalElapsed=Number.isFinite(+d.elapsed)?+d.elapsed:elapsed;
    const finalViolations=Number.isFinite(+d.violations)?+d.violations:violations;
    violations=finalViolations; violationEl.textContent=finalViolations;
    const sportName=sport==='soccer'?'Sút bóng vào lưới':sport==='basketball'?'Ném bóng vào rổ':'Không có';
    questionRoot.innerHTML=`<section class="pro-finish-card"><div class="finish-medal">🏆</div><div class="finish-kicker">HOÀN THÀNH VÒNG THI</div><h2>${score} điểm</h2><p>Game thể thao: <b>${sportName}</b></p><div class="finish-stats"><div><span>Thời gian</span><strong>${fmt(finalElapsed)}</strong></div><div><span>Vi phạm</span><strong>${finalViolations}</strong></div><div><span>Số câu</span><strong>${totalQuestions()}</strong></div></div><a class="btn finish-btn" href="${d.redirect}">Xem bảng xếp hạng</a></section>`;
  }catch(err){questionRoot.innerHTML='<div class="flash danger">Không thể lưu kết quả. Vui lòng kiểm tra mạng rồi tải lại trang.</div>';}
}
render();
})();
</script>
