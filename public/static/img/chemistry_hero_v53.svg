    <text x="700" y="246" fill="#c9f3ff" font-family="Times New Roman, serif" font-size="34">CO₂</text>
    <text x="548" y="330" fill="#c9f3ff" font-family="Times New Roman, serif" font-size="26">CH₃COOH</text>
  </g>
