<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="Dụng cụ thí nghiệm hóa học">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4278" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06244a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63e7ff"/><stop offset="1" stop-color="#008fd5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe569"/><stop offset="1" stop-color="#e99a0c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="620" rx="42" fill="url(#bg)"/>
  <g opacity=".22" stroke="#a9e9ff" fill="none" stroke-width="2">
    <path d="M120 120h95l42 72 82-4 43 74"/><circle cx="120" cy="120" r="8"/><circle cx="215" cy="120" r="8"/><circle cx="257" cy="192" r="8"/><circle cx="339" cy="188" r="8"/><circle cx="382" cy="262" r="8"/>
    <path d="M620 92l42 24v48l-42 24-42-24v-48z"/><path d="M620 92v96M578 116l84 48M662 116l-84 48"/>
