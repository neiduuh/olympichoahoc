services:
  - type: web
    name: olympic-hoa-hoc
    env: python
    buildCommand: pip install -r requirements.txt && python build_assets.py
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
